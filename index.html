<body>
<main id="stage">
 <canvas id="world" tabindex="0" aria-label="Exploration map. Swipe, use arrows or WASD to move and mine. Up places ladders. E interacts. Space blasts. Waiting is safe."></canvas>
 <section class="fieldHUD" aria-label="Current run status">
  <div class="hudLeft">
   <button class="fieldMenu" data-command="pause" title="Game menu (Esc)" aria-label="Open game menu"><span data-icon="pause"></span></button>
   <div class="hudMeters">
    <div class="batteryHUD" id="batteryHUD"><span data-icon="battery"></span><div class="energyMeter"><div class="energyHeader"><small>Battery</small><b id="energyValue">120</b></div><div class="energyBar" id="energyBar" role="progressbar" aria-label="Battery" aria-valuemin="0" aria-valuemax="120" aria-valuenow="120"><div class="energyFill" id="energyFill"></div></div></div></div>
    <div class="hullHUD" id="hullHUD"><span data-icon="heart"></span><span>Hull</span><b id="hullValue">5/5</b></div>
   </div>
  </div>
  <div class="fieldScore"><strong id="measureText">0 m</strong><small id="measureLabel">Surface</small><div class="cargoCount"><span id="pocketCoins">0</span><span data-icon="coin"></span></div><span class="cargoLabel">Run coins</span></div>
 </section>
 <button id="goalHint" data-command="contracts"><span data-icon="flag"></span><span id="goalText">Bank 12 ore</span></button>
 <button id="buildButton" class="buildBadge hide" data-command="inventory" aria-label="View run upgrades"><span data-icon="relic"></span><span id="moduleCount">0</span> run upgrades</button>
 <button id="worldPrompt" class="hide" aria-label="Interact with nearby landmark"></button>
 <section id="inspectBubble" class="inspectBubble hide" aria-live="polite"><strong id="inspectTitle"></strong><p id="inspectDetail"></p><button id="inspectClose" aria-label="Dismiss information"><span data-icon="close"></span></button></section>
 <div id="gestureHint">Swipe or use arrows to move & mine</div>
 <nav id="toolDock" aria-label="Run tools">
  <button id="blastButton" class="toolButton" data-command="blast" title="Blast (Space). Costs 3 battery." aria-label="Blast nearby blocks"><span data-icon="bomb"></span><span class="toolName">Blast</span><span class="toolCount" id="toolBombs">3</span><span class="actionCost">3 power</span></button>
  <button id="scanButton" class="toolButton" data-command="scan" title="Scan (F). Reveals nearby terrain and clues."><span data-icon="sonar"></span><span class="toolName">Scan</span><span class="scanCost" id="toolScanCost">6 power</span></button>
  <button class="toolButton" data-command="tools" title="Scaffolding, brace, beacon, map & current build"><span data-icon="tools"></span><span class="toolName">Tools</span></button>
  <button class="toolButton returnButton" data-command="recall" title="Return (Q). Bank cargo and end this run."><span data-icon="home"></span><span class="toolName">Return</span></button>
 </nav>
 <div id="dpad" aria-label="Optional movement buttons">
  <button class="dirButton" data-dx="0" data-dy="-1" aria-label="Move up"><span data-icon="up"></span></button>
  <button class="dirButton" data-dx="-1" data-dy="0" aria-label="Move left"><span data-icon="left"></span></button>
  <button class="dirButton" data-dx="0" data-dy="1" aria-label="Move down"><span data-icon="down"></span></button>
  <button class="dirButton" data-dx="1" data-dy="0" aria-label="Move right"><span data-icon="right"></span></button>
 </div>
</main>

function showInventory(){const r=engine.run,st=engine.stats();openModal('inventory','Your current build','Blue starting gear + purple upgrades found this run.',`<section class="equippedPermanent"><div class="sectionLine">${keepBadge()}<span class="small muted">Equipped at launch</span></div><div class="startingStats"><span>${icon('battery','',17)}Base ${M.RIGS.find(q=>q.id===r.rig).energy+(r.upgrades.battery||0)*25}</span><span>${icon('heart','',17)}Base ${M.RIGS.find(q=>q.id===r.rig).hp+(r.upgrades.hull||0)}</span><span>${icon('spring','',17)}Safe fall ${M.RIGS.find(q=>q.id===r.rig).spring+(r.upgrades.springs||0)*2}m</span></div></section><div class="sectionLine inventoryScope">${runBadge()}<span class="small muted">${r.relics.length}/${st.slots} slots</span></div><div class="inventoryList">${r.relics.map(id=>{const q=M.RELICS.find(r=>r.id===id);return `<button class="inventoryItem" data-relic-detail="${id}">${icon(q.icon,'#957bb1',28)}<div><h3>${esc(moduleTitles[id])}</h3><p>${esc(q.desc)}</p>${id==='secondwind'&&r.flags.secondwind?'<span class="small warningText">Used</span>':''}</div></button>`;}).join('')||'<div class="emptyBuild">No run upgrades yet.<br><span>Find a shrine in a room, the western quarry or a floating island.</span></div>'}</div><div class="currentStats"><span>Current maximums</span><b>${st.maxEnergy} battery · ${st.maxHp} hull · ${st.safeFall}m safe fall</b></div>${r.artifacts.length?'<div class="notice">Core in cargo. Return or bank it before a failure.</div>':''}`,`<button class="btn primary" data-command="close">Return to field</button>`,{scope:'run'});}
function showTools(){if(!playing){showCamp();return;}const r=engine.run;openModal('tools','Tools','Tools spend power only when you use them.',`<div class="toolsList"><button data-command="scaffold"><span class="itemIcon">${icon('bridge')}</span><span><strong>Scaffolding</strong><small>Anchor sky moves · ${r.rig==='cloudrunner'||engine.has('cloudstep')?'no extra cost':'+1 power per air step'}</small></span><b class="${r.scaffold?'blue':''}">${r.scaffold?'On':'Off'}</b></button><button data-command="brace" ${r.shield?'disabled':''}><span class="itemIcon">${icon('shield')}</span><span><strong>Brace</strong><small>Next 2 hits deal 2 less damage · 3 power</small></span><b>${r.shield?'Active':icon('right','',17)}</b></button><button data-command="beacon" ${!r.beacons?'disabled':''}><span class="itemIcon">${icon('beacon')}</span><span><strong>Banking beacon</strong><small>Bank without ending this run · 3 power</small></span><b>×${r.beacons}</b></button><button data-command="inventory"><span class="itemIcon purpleIcon">${icon('relic')}</span><span><strong>Run upgrades</strong><small>View your current build</small></span><b>${r.relics.length}/${engine.stats().slots}</b></button><button data-command="atlas"><span class="itemIcon">${icon('map')}</span><span><strong>Map</strong><small>Explored terrain, shrines & beacon return</small></span>${icon('right','',17)}</button><button data-command="minerals"><span class="itemIcon">${icon('gem')}</span><span><strong>Minerals & clues</strong><small>Learn what to look for</small></span>${icon('right','',17)}</button></div>`,`<button class="btn primary" data-command="close">Back</button>`,{narrow:true});}

function showHelp(){openModal('help','How to play','Explore at your own pace. No time limits.',`<div class="helpSteps"><section><span>1</span><div><h3>Swipe or use arrows to move & mine</h3><p>Move into soil or ore to mine it. Move up to place ladders. Stone needs a blast. Tap a nearby block to move; tap a distant block to inspect.</p></div></section><section><span>2</span><div><h3>Watch battery and hull</h3><p>Only your actions use battery. Long falls and mined hazards damage hull. Guardians respond to nearby actions only. Waiting is always safe.</p></div></section><section><span>3</span><div><h3>Return before the rig fails</h3><p>Return banks your cargo and ends the run. Keep 100% of coins at base or a beacon, 85% remotely. Failure loses unbanked cargo and carried cores.</p></div></section></div><div class="scopeColumns"><section class="scopePanel permanentPanel"><h3>${icon('keep','',19)} Permanent</h3><p>Buy at base with banked coins + research. Equipped every new run. Research and discoveries always survive.</p></section><section class="scopePanel runPanel"><h3>${icon('relic','',19)} This run only</h3><p>Choose at shrines. Works immediately. Resets after success or failure. Combine upgrades to make a build.</p></section></div><details class="extraUpgrades"><summary>Sky, rare minerals & controls ${icon('down','',16)}</summary><p>Choose Go up to start beside the sky tower. Climb with Up. Use scaffolding for safe sideways travel. Surface tree trunks give timber for permanent facilities.</p><p>Rare ore pockets have scattered geological clues. Learn their shapes in Minerals & clues. Some worlds have no ultra-rare minerals.</p><div class="controlsTable">${[['Move & mine','Arrows / WASD'],['Interact','E'],['Blast','Space'],['Scan','F'],['Scaffolding','B'],['Brace','H'],['Place beacon','G'],['Return','Q'],['Map / build / base','M / I / C'],['Game menu','Esc']].map(([a,b])=>`<div><span>${a}</span><kbd>${b}</kbd></div>`).join('')}</div><p>Touch swipes move while your fing function showAtlas(tab=null){if(tab)atlasTab=tab;const w=engine.world,r=engine.run,region=atlasTab,filter=n=>region==='sky'?n.y<-5:region==='surface'?n.y>=-5&&n.y<=5:n.y>5;const nodes=[...w.nodes.values()].filter(n=>filter(n)&&(w.seen.has(M.key(n.x,n.y))||n.type==='camp'||meta.buildings.observatory)).sort((a,b)=>Math.abs(a.y-r.y)-Math.abs(b.y-r.y));const anchors=[...w.nodes.values()].filter(n=>['beacon','relay'].includes(n.type));
 openModal('atlas','Map','Dark terrain is unexplored.',`<nav class="tabs">${[['mine','Mine'],['surface','Surface'],['sky','Sky']].map(([id,label])=>`<button class="tab ${id===region?'active':''}" data-atlas-tab="${id}">${label}</button>`).join('')}</nav><div class="atlasLayout"><div><div class="atlasScroller" id="atlasScroller"><canvas id="atlasCanvas" aria-label="Explored map"></canvas></div><div class="mapLegend"><span class="blue">Rig</span><span class="purple">Shrine</span><span class="warningText">Guardian</span></div></div><div class="mapLandmarks"><h3>Landmarks</h3>${nodes.map(n=>`<div class="landmark"><span>${icon(n.type==='shrine'?'relic':n.type==='station'?'battery':n.type==='artifact'?'core':n.type==='camp'?'home':'beacon','',16)}${esc(n.name||n.type)}${n.used?' · used':''}</span><small>x ${n.x} · ${n.y<0?-n.y-1:n.y}m ${n.y<0?'up':'down'}</small></div>`).join('')||'<p class="muted small">Explore or scan to chart landmarks.</p>'}${playing&&anchors.length?`<h3 class="returnHeading">Return to beacon</h3><p class="small muted">8 power + 1 recall. Does not end the run.</p>${anchors.map(n=>`<button class="btn small full" data-return-beacon="${n.id}" ${r.recalls<=0||r.energy<=8?'disabled':''}>${esc(n.name)}</button>`).join('')}`:''}</div></div>`,`<span class="small muted">Seed ${r.seed}</span><button class="btn primary" data-command="return">Back</button>`);drawAtlas(region,nodes);
}
function drawAtlas(region,nodes){const cv=$('atlasCanvas'),c=cv.getContext('2d'),scale=3,min=region==='sky'?-M.MAX_ALT:region==='surface'?-10:0,max=region==='sky'?-1:region==='surface'?12:M.MAX_DEPTH;cv.width=(M.WIDTH*2+1)*scale;cv.height=(max-min+1)*scale;c.fillStyle='#292734';c.fillRect(0,0,cv.width,cv.height);for(let y=min;y<=max;y++)for(let x=-M.WIDTH;x<=M.WIDTH;x++){if(!engine.world.known(x,y))continue;const t=engine.world.tile(x,y);c.fillStyle=t==='air'?(y<0?'#87cfdf':'#795663'):M.TILES[t]?.color||'#292734';c.fillRect((x+M.WIDTH)*scale,(y-min)*scale,scale,scale);}for(const n of nodes){c.fillStyle=n.type==='shrine'?'#c5a1e1':n.type==='artifact'?'#ffe89d':'#c3dadc';c.fillRect((n.x+M.WIDTH)*scale-1,(n.y-min)*scale-1,5,5);}for(const e of engine.world.enemies.values())if(!e.dead&&engine.world.known(e.x,e.y)){c.fillStyle='#f3b391';c.fillRect((e.x+M.WIDTH)*scale,(e.y-min)*scale,3,3);}const r=engine.run;if(r.y>=min&&r.y<=max){c.fillStyle='#aee183';c.fillRect((r.x+M.WIDTH)*scale-2,(r.y-min)*scale-2,7,7);const sc=$('atlasScroller');sc.scrollTop=Math.max(0,(r.y-min)*scale*(sc.clientWidth/cv.width)-sc.clientHeight/2);}}
function settingRow(id,title,desc){return `<div class="settingRow"><div><h3>${title}</h3><p>${desc}</p></div><button class="toggle ${meta.settings[id]?'on':''}" data-toggle-setting="${id}" aria-label="Toggle ${title}" aria-pressed="${meta.settings[id]}"></button></div>`;}
function showSettings(){openModal('settings','Settings & save','Works offline. No network or account needed.',settingRow('sound','Soft sound effects','Quiet mining, pickup and menu sounds.')+settingRow('motion','Smooth movement','Player and camera interpolation. Cosmetic only.')+settingRow('dpad','Direction buttons','Optional on-screen arrows alongside swipe controls.')+`<div class="settingRow"><div><h3>View size</h3><p>${meta.settings.zoom}px per block.</p></div><div class="row"><button class="btn small" data-command="zoomout" aria-label="Zoom out">−</button><button class="btn small" data-command="zoomin" aria-label="Zoom in">+</button></div></div><div class="settingRow"><div><h3>Fullscreen</h3><p>When supported by your browser.</p></div><button class="btn small" data-command="fullscreen">Open</button></div><div class="saveActions"><button class="btn blueButton" data-command="export">Export save</button><button class="btn" data-command="import">Import save</button><button class="btn ghost" data-command="credits">Credits</button></div><p class="notice ${storageOK?'subtle':''}">${storageOK?'Autosave keeps your permanent progress and current run.':'Storage is blocked in this viewer. Export before leaving, or download and open the game in your browser.'}</p><button class="textButton warningText" data-command="reset">Reset all progress…</button>`,`<span class="small muted">Version 2.0 · old saves supported</span><button class="btn primary" data-command="return">Back</button>`,{narrow:true});}
function showExport(){const text=JSON.stringify(save());openModal('export','Export your save','Permanent progress + current run.',`<p class="muted">Download the JSON file or copy the text. Import it to resume in another browser.</p><textarea class="saveArea" id="saveExport" readonly aria-label="Exported save">${esc(text)}</textarea>`,`<button class="btn ghost" data-command="settings">Back</button><div class="row"><button class="btn" data-command="copy-save">Copy</button><button class="btn blueButton" data-command="download-save">Download JSON</button></div>`,{narrow:true});}
function downloadSave(){const url=URL.createObjectURL(new Blob([JSON.stringify(save(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='entrenched-worlds-apart-save.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function showImport(){openModal('import','Import a save','Version 1 and 2 saves are supported.',`<button class="btn" data-command="choose-file">Choose JSON file</button><textarea class="saveArea" id="saveImport" placeholder="Or paste save text" aria-label="Save text"></textarea>`,`<button class="btn ghost" data-command="settings">Cancel</button><button class="btn blueButton" data-command="import-text">Check save</button>`,{narrow:true});}
function validateSave(d){if(d?.format!=='entrenched-worlds-apart'||![1,2].includes(d.version)||!d.meta)throw Error('Not a compatible Entrenched save.');const nm=M.normalizeMeta(d.meta),active=Boolean(d.active&&!d.active.run?.ended),ng=active?M.GameEngine.restore(nm,d.active):new M.GameEngine(nm,{seed:d.meta.lastSummary?.seed||8675309});return {meta:nm,engine:ng,playing:active};}

function showAbandon(){openModal('abandon','Abandon this run?','Banked progress and research remain safe.',`<p>You lose ${engine.run.coins} unbanked coins${meta.buildings.salvage?' (25% salvaged)':''}, ${engine.run.timber} timber, run upgrades and any carried core.</p><p class="muted">Return instead to bank your cargo safely.</p>`,`<button class="btn primary" data-command="recall">Return instead</button><button class="btn danger" data-command="confirm-abandon">Abandon</button>`,{narrow:true});}

function command(cmd){switch(cmd){
 case'close':if(!playing)returnToGame();else closeModal();break;case'return':returnToGame();break;case'setup':showSetup();break;case'launch':launch();break;
 case'blast':act('blast');break;case'scan':act('scan');break;case'scaffold':act('toggleScaffold');break;case'brace':act('brace');break;case'beacon':act('deployBeacon');break;
 case'recall':showRecall();break;case'camp':showCamp('overview');break;case'upgrade':showCamp('workshop');break;case'rigs':showCamp('rigs');break;case'contracts':showCamp('contracts');break;
 case'atlas':showAtlas();break;case'inventory':showInventory();break;case'tools':showTools();break;case'pause':showPause();break;case'help':showHelp();break;case'minerals':showMinerals();break;case'settings':showSettings();break;case'credits':showCredits();break;
 case'zoomin':case'zoomout':meta.settings.zoom=M.clamp(meta.settings.zoom+(cmd==='zoomin'?4:-4),28,72);renderer.transform();save();if(currentModal==='settings')showSettings();break;
 case'fullscreen':try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>toast('Open the downloaded game in your browser for fullscreen.'));}catch(e){toast('Fullscreen is unavailable here.');}break;
 case'export':showExport();break;case'download-save':downloadSave();break;case'copy-save':{const t=$('saveExport');t.select();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t.value).then(()=>toast('Save copied.')).catch(()=>toast('Copy the selected text manually.'));else{try{document.execCommand('copy');toast('Save copied.');}catch(e){toast('Copy the selected text manually.');}}break;}
 case'import':showImport();break;case'choose-file':$('importFile').value='';$('importFile').click();break;case'import-text':checkImport($('saveImport').value);break;case'confirm-import':restoreImport();break;
 case'reset':showReset();break;case'confirm-reset':if($('resetWord').value==='RESET'){meta=M.freshMeta();if(innerWidth<=600)meta.settings.zoom=40;engine=new M.GameEngine(meta,{seed:8675309});playing=false;pendingDialog=null;selectedRig='delver';selectedMutation='standard';selectedRoute='surface';selectedSeedText='';renderer.recenter();save();syncHUD();showTitle();}else toast('Type RESET to confirm.','warn');break;
 case'abandon':showAbandon();break;case'confirm-abandon':closeModal(true);engine.finish(false,'The rig was abandoned.');flush();break;
}}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.command){command(b.dataset.command);return;}if(b.dataset.dx!==undefined){move(Number(b.dataset.dx),Number(b.dataset.dy));return;}
 if(b.id==='worldPrompt'){interact(b.dataset.node);return;}if(b.id==='inspectClose'){inspected=null;renderer.hover=null;fieldHint=null;updateInspect();return;}

$('modalLayer').addEventListener('click',e=>{if(e.target===$('modalLayer')&&closable&&playing)closeModal();});
